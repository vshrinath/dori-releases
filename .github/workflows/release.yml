name: Build and validate atomic release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.14.1
        required: true
        type: string
      root_sha:
        description: Full immutable commit SHA from vshrinath/dori
        required: true
        type: string
      dry_run:
        description: Build and validate without creating a GitHub release
        required: true
        default: true
        type: boolean

concurrency:
  group: dori-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag }}
      ROOT_SHA: ${{ inputs.root_sha }}
      DORI_CAPABILITY_MANIFEST_PATH: ${{ github.workspace }}/artifacts/capabilities.json
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

    steps:
      - name: Validate immutable inputs
        run: |
          if ! [[ "$ROOT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::root_sha must be a full 40-character commit SHA"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::tag must be an explicit semantic version beginning with v"
            exit 1
          fi

      - name: Preflight release credentials
        env:
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          missing=0
          for name in BUILD_TOKEN APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing release credential::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Reject an existing release tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::A release already exists for $TAG; refusing to replace pinned inputs or assets"
            exit 1
          fi

      - name: Checkout pinned Dori workspace
        uses: actions/checkout@v4
        with:
          repository: vshrinath/dori
          ref: ${{ inputs.root_sha }}
          token: ${{ secrets.BUILD_TOKEN }}
          path: dori
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Record all source revisions
        run: |
          test "$(git -C dori rev-parse HEAD)" = "$ROOT_SHA"
          mkdir -p artifacts
          root=$(git -C dori rev-parse HEAD)
          engine=$(git -C dori/dori-engine rev-parse HEAD)
          portal=$(git -C dori/dori-portal rev-parse HEAD)
          processing=$(git -C dori/dori-processing-services rev-parse HEAD)
          broker=$(git -C dori/workers/dori-auth-broker rev-parse HEAD)
          jq -n \
            --arg tag "$TAG" --arg root "$root" --arg engine "$engine" \
            --arg portal "$portal" --arg processing "$processing" --arg broker "$broker" \
            '{schemaVersion:1,tag:$tag,source:{root:$root,engine:$engine,portal:$portal,processing:$processing,authBroker:$broker}}' \
            > artifacts/provenance.json
          cat artifacts/provenance.json >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dori/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Install frozen workspace dependencies
        working-directory: dori
        run: pnpm install --frozen-lockfile

      - name: Install frozen processing dependencies
        working-directory: dori/dori-processing-services
        run: npm ci

      - name: Verify source and contracts
        working-directory: dori
        run: |
          node scripts/check-agent-instructions.mjs
          node scripts/check-governance.mjs
          pnpm --filter './dori-engine/packages/*' build
          pnpm -C dori-engine typecheck
          pnpm -C dori-engine test
          pnpm -C dori-portal typecheck
          pnpm -C dori-portal test
          npm --prefix dori-processing-services test
          npm --prefix dori-processing-services run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: dori/dori-engine/desktop/src-tauri -> target

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/dori-release.keychain-db"
          certificate="$RUNNER_TEMP/dori-release.p12"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"

      - name: Build signed capability manifest
        run: |
          inventory=dori/release/capabilities/inventory.json
          licenses=dori/release/capabilities/LICENSES.md
          test -f "$inventory"
          test -s "$licenses"
          node dori/dori-engine/desktop/scripts/build-capability-manifest.mjs "$inventory" "$DORI_CAPABILITY_MANIFEST_PATH"
          node scripts/stage-capabilities.mjs "$inventory" "$DORI_CAPABILITY_MANIFEST_PATH" artifacts/capabilities "${{ github.repository }}" "$TAG"
          node --test scripts/stage-capabilities.test.mjs
          pnpm -C dori/dori-engine/desktop capabilities:test

      - name: Build portal and sidecars
        working-directory: dori
        env:
          DORI_APP_VERSION: ${{ inputs.tag }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          node -e "const v=require('./dori-engine/desktop/src-tauri/tauri.conf.json').version; if ('v'+v !== process.env.TAG) throw new Error('release tag does not match Tauri version')"
          pnpm -C dori-portal build:tauri
          node dori-engine/desktop/scripts/build-sidecars.mjs
          pnpm -C dori-engine/desktop package:check

      - name: Build signed universal app without publishing
        uses: tauri-apps/tauri-action@v0
        env:
          DORI_CAPABILITY_MANIFEST_PATH: ${{ env.DORI_CAPABILITY_MANIFEST_PATH }}
        with:
          projectPath: dori/dori-engine/desktop/src-tauri
          args: --target universal-apple-darwin

      - name: Validate notarization, Gatekeeper, and updater signature
        run: |
          app=$(find dori/dori-engine/desktop/src-tauri/target -path '*/release/bundle/macos/Dori.app' -print -quit)
          dmg=$(find dori/dori-engine/desktop/src-tauri/target -name '*.dmg' -print -quit)
          updater=$(find dori/dori-engine/desktop/src-tauri/target -name '*.app.tar.gz' -print -quit)
          test -n "$app" && test -n "$dmg" && test -n "$updater" && test -s "${updater}.sig"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          brew install minisign
          printf '%s' "$(jq -r '.plugins.updater.pubkey' dori/dori-engine/desktop/src-tauri/tauri.conf.json)" | base64 --decode > "$RUNNER_TEMP/updater.pub"
          minisign -Vm "$updater" -x "${updater}.sig" -p "$RUNNER_TEMP/updater.pub"
          cp "$dmg" artifacts/
          cp "$updater" "${updater}.sig" artifacts/
          pnpm -C dori/dori-engine/desktop audit

      - name: Create updater manifest last
        run: |
          updater=$(find artifacts -maxdepth 1 -name '*.app.tar.gz' -print -quit)
          updater_name=$(basename "$updater")
          version="${TAG#v}"
          url="https://github.com/${{ github.repository }}/releases/download/${TAG}/${updater_name}"
          jq -n \
            --arg version "$version" \
            --arg notes "Dori $TAG" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --rawfile signature "${updater}.sig" \
            --arg url "$url" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{"darwin-universal":{signature:$signature,url:$url}}}' \
            > artifacts/latest.json

      - name: Retain validated dry-run artifacts
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dori-${{ inputs.tag }}-validated
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Create hidden draft and upload complete asset set
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "${{ github.repository }}" --draft --title "Dori $TAG" --notes "Validated Dori release."
          while IFS= read -r -d '' asset; do
            gh release upload "$TAG" "$asset" --repo "${{ github.repository }}"
          done < <(find artifacts -maxdepth 2 -type f -print0)

      - name: Verify draft assets and publish atomically
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -maxdepth 2 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/expected-assets"
          gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.assets[].name' | sort > "$RUNNER_TEMP/remote-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/remote-assets"
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false ${{ contains(inputs.tag, '-') && '--prerelease' || '--latest' }}
